<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu painel — Studium</title>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet" />
 
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/painel.css" />
  </head>
  <body>
    <header class="barra">
      <a class="logo" href="index.html" aria-label="Studium, início"><img src="img/STUDIUM (150 x 100 px).svg" alt="Studium" /></a>
      <nav class="menu">
        <a href="index.html">Início</a>
        <a href="#ia">Studium AI</a>
      </nav>
      <div class="usuario">
        <h4>Olá, <strong id="nomeuser"></strong></h4>
        <button class="btn btn2" id="btnsair">Sair</button>
      </div>
    </header>
 
    <div class="topopainel">
      <span class="tag">seu painel</span>
      <h1>O que você precisa fazer</h1>
      <p>Suas turmas e as próximas entregas, tudo num lugar só.</p>
    </div>
    <main id="painel">
 
      <div class="gradepainel">
        <div>
          <section class="bloco">
            <h2>Próximas atividades</h2>
           <div id="minhasAtividades"></div>
          </section>
        </div>

        <div class="painelmeio">
          <section class="bloco">
            <h2>Matérias</h2>
            <div class="listamaterias" id="listamaterias">

  <div class="materia-card">
    <div class="materia-topo">
      <i class="fa-solid fa-calculator"></i>
      <h3>Matemática</h3>
    </div>

    <div class="materia-baixo">
      <span>2º Reg 2</span>
      <span class="seta">›</span>
    </div>
  </div>

  <div class="materia-card">
    <div class="materia-topo">
      <i class="fa-solid fa-atom"></i>
      <h3>Física</h3>
    </div>

    <div class="materia-baixo">
      <span>2º Reg 2</span>
      <span class="seta">›</span>
    </div>
  </div>

</div>
          </section>
        </div>
 
       <div class="paineldireita">
    <section class="bloco">
        <h2>Entrar em uma turma</h2>

        <form class="formpainel" id="formentrar">
            <input type="text" id="codigo" placeholder="Código da turma (ex: A1B2C3)" maxlength="8" required/>
            <button type="submit" class="btn btn1">Entrar</button>
        </form>
        <p class="aviso" id="msgentrar"></p>
    </section>
</div>
 
          <section class="bloco">
    <h2>Minhas turmas</h2>
    <div id="minhasTurmas"></div>
</section>
        </div>
      </div>
    </main>
 
    <script src="sessao.js"></script>
    <script src="/js/painel-aluno.js"></script>
  </body>
</html>
