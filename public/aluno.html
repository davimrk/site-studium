<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu painel — Studium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet" />
 
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/painel.css" />
    <link rel="stylesheet" href="/css/navegacao.css" />
    <link rel="stylesheet" href="/css/aluno.css" />
  </head>
  <body>
    <header class="nav-studium">
      <a class="nav-card nav-marca" href="/index.html" aria-label="Studium, início">
        <img src="/img/STUDIUM%20(150%20x%20100%20px).svg" alt="Studium" />
      </a>
      <nav class="nav-card nav-links" id="menu" aria-label="Navegação principal">
        <a href="/aluno.html" aria-current="page">Painel do aluno</a>
        <a href="#atividades">Atividades</a>
        <a href="#turmas">Turmas</a>
      </nav>
      <div class="nav-acoes">
        <div class="nav-card nav-conta">
          <button type="button" class="nav-primario" id="btnsair">Sair</button>
        </div>
      </div>
    </header>
 
    <main class="painel-aluno">
      <section class="boas-vindas" aria-labelledby="saudacao">
        <div>
          <h1 id="saudacao">Olá<span id="nomeuser"></span>!</h1>
          <p>Veja suas atividades e acompanhe suas turmas.</p>
        </div>
        <img src="/img/pombo%20branco.png" alt="" />
      </section>

      <div class="colunas-aluno">
        <section class="secao-aluno" id="atividades">
          <h2>Atividades e provas</h2>
          <div id="minhasAtividades" aria-live="polite">Carregando atividades…</div>
        </section>

        <aside class="lateral-aluno">
          <section class="secao-aluno" id="turmas">
            <h2>Minhas turmas</h2>
            <div id="minhasTurmas" aria-live="polite">Carregando turmas…</div>
          </section>

          <section class="secao-aluno entrar-turma">
            <h2>Entrar em uma turma</h2>
            <form class="formpainel" id="formentrar">
              <label for="codigo">Código da turma</label>
              <input id="codigo" type="text" placeholder="Ex.: STU123" maxlength="8" required />
              <button type="submit" class="btn btn1">Entrar na turma</button>
            </form>
            <p class="aviso" id="msgentrar" role="status"></p>
          </section>
        </aside>
      </div>
    </main>
    <script src="/js/painel-aluno.js"></script>
  </body>
</html>
