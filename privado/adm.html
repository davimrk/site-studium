
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administração — Studium</title>

    <link rel="stylesheet" href="/css/adm.css">
    <script src="/js/adm.js" defer></script>
</head>
<body>

    <header>
        <h2>STUDIUM</h2>
        <span>Administração</span>
    </header>

    <main>
        <h1>Painel administrativo</h1>
        <p>Selecione o que deseja consultar.</p>

        <div class="botoes">
            <button data-consulta="turmas">Turmas</button>
            <button data-consulta="professores">Professores</button>
            <button data-consulta="alunos">Alunos</button>
        </div>

        <section id="resultado" hidden>
            <h2 id="titulo"></h2>
            <div id="lista"></div>
        </section>

        <p id="mensagem" role="status"></p>
    </main>

</body>
</html>
