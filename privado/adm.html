
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administração — Studium</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/adm.css">
    <script src="/js/adm.js" defer></script>
    <link rel="stylesheet" href="/css/navegacao.css" />
  </head>
<body>

    <header class="nav-studium">
      <a class="nav-card nav-marca" href="/index.html" aria-label="Studium, início">
        <img src="/img/STUDIUM%20(150%20x%20100%20px).svg" alt="Studium" />
      </a>
      <nav class="nav-card nav-links" id="menu" aria-label="Navegação principal">
        <a href="/adm.html" aria-current="page">Administração</a>
      </nav>
      <div class="nav-acoes">
        <div class="nav-card nav-conta">
          <button type="button" class="nav-primario" id="btnsair">Sair</button>
        </div>
      </div>
    </header>

    <main class="painel-adm">
        <section class="abertura-adm">
            <h1>Painel administrativo</h1>
            <p>Consulte turmas, professores, alunos, disciplinas e atividades.</p>
        </section>

        <div class="botoes-adm" role="group" aria-label="Tipo de registro">
            <button type="button" aria-pressed="false" data-consulta="turmas">Turmas</button>
            <button type="button" aria-pressed="false" data-consulta="professores">Professores</button>
            <button type="button" aria-pressed="false" data-consulta="alunos">Alunos</button>
            <button type="button" aria-pressed="false" data-consulta="disciplinas">Disciplinas</button>
            <button type="button" aria-pressed="false" data-consulta="atividades">Atividades e provas</button>
        </div>

        <section id="resultado" hidden>
            <h2 id="titulo"></h2>
            <div id="lista"></div>
        </section>

        <div id="grafico" hidden>
          <img id="imagemGrafico" alt="Gráfico administrativo">
        </div>


        <p id="mensagem" rola="status"></p>
    </main>

    <script src="/js/logout.js"></script>
  </body>
</html>
